# This will deploy the safe and secure app to the server
name: Deploy To Server

on:
    workflow_call: 

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
