# API keys, sensitive data, credentials, GitLeaks
name: Secrets Scan
on: 
    workflow_call: 

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Run GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                GitHub_TOKEN: ${{ secrets.GITHUB_TOKEN }} #GitHub Actions manages itself
                