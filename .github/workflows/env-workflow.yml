name: Environment Workflow
on:
    # push:
    #     branches: [main]
    workflow_dispatch: 
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: setup node
              uses: actions/setup-node@v3

            - name: Install dependencies
              run: npm install

            - name: run tests
              run: npm test


    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment: development
        steps: 
            - name: Deploy on dev server
              run: echo "Deploying to dev branch"


